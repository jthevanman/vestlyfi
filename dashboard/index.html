<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard | VestlyFi</title>
<!-- Unlaunched: keep out of search until the dashboard goes public.
     No analytics, no sitemap entry, no links from other pages. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Exo+2:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/currency.js"></script>
<script>try { if (localStorage.getItem('vf-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<style>
/* Graphite theme, same tokens as /budget/. */
:root {
  color-scheme: dark;
  --bg:#131313; --raised:#1b1b1b; --surface:#262626; --surface-2:#303030;
  --accent:#dcc392; --accent-light:#ecd9b2; --on-accent:#161310;
  --cream:#ededed; --cream-dim:#b4b4b4; --muted:#8d8d8d;
  --line:rgba(255,255,255,0.08); --green:#5cc28e; --red:#e8706a; --amber:#e3a857;
  --page:#0b0b0b; --hover:rgba(255,255,255,0.03); --shadow:0 8px 16px -8px rgba(0,0,0,0.8);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#ffffff; --raised:#ffffff; --surface:#f1efeb; --surface-2:#e7e4de;
  --accent:#1b1b1b; --accent-light:#000000; --on-accent:#ffffff;
  --cream:#1b1b1b; --cream-dim:#565656; --muted:#7b7b7b;
  --line:rgba(0,0,0,0.09); --green:#1f9a5e; --red:#cf4a42; --amber:#b5761d;
  --page:#f3f2ef; --hover:rgba(0,0,0,0.03); --shadow:0 6px 14px -8px rgba(0,0,0,0.22);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--surface-2); border:3px solid transparent; border-radius:999px; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover { background-color:var(--muted); }
::-webkit-scrollbar-button { display:none; width:0; height:0; }
@supports (-moz-appearance:none) { * { scrollbar-width:thin; scrollbar-color:var(--surface-2) transparent; } }
body { background:var(--page); color:var(--cream); font-family:'Outfit',sans-serif; font-weight:400; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; min-height:100vh; overflow-x:hidden; }
button, input { font-family:inherit; }
a { color:inherit; }
.hidden { display:none !important; }

/* ── Auth ── */
#authScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.auth-panel { width:100%; max-width:380px; }
.brand { font-family:'Exo 2',sans-serif; font-size:1.15rem; color:var(--accent); text-decoration:none; }
.auth-title { font-size:1.4rem; font-weight:400; margin:18px 0 6px; }
.auth-sub { font-size:0.85rem; color:var(--muted); line-height:1.55; margin-bottom:22px; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:0.68rem; color:var(--muted); margin-bottom:5px; letter-spacing:0.05em; text-transform:uppercase; }
.field input { width:100%; padding:12px 16px; background:var(--surface); border:1px solid transparent; border-radius:12px; color:var(--cream); font-size:16px; outline:none; }
.field input:focus { border-color:var(--accent); }
.msg { font-size:0.8rem; min-height:20px; margin-top:8px; color:var(--cream-dim); }
.msg.err { color:var(--red); }
.auth-alt { font-size:0.8rem; color:var(--muted); margin-top:18px; line-height:1.6; }
.auth-alt a { color:var(--accent); }

/* ── Buttons: actions are pills or circles ── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:999px; border:none; font-size:0.85rem; font-weight:600; cursor:pointer; transition:background .15s, color .15s; text-decoration:none; white-space:nowrap; }
.btn-gold { background:var(--accent); color:var(--on-accent); }
.btn-gold:hover { background:var(--accent-light); }
.btn-ghost { background:var(--surface); color:var(--cream-dim); font-weight:500; }
.btn-ghost:hover { background:var(--surface-2); color:var(--cream); }
.btn-block { width:100%; }
.btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.link-btn { background:none; border:none; color:var(--accent); font-size:0.8rem; cursor:pointer; padding:0; }

/* ── Shell ── */
.app { max-width:1000px; margin:0 auto; padding:16px 16px calc(48px + env(safe-area-inset-bottom)); }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0 18px; }
.topbar-left, .topbar-right { display:flex; align-items:center; gap:8px; min-width:0; }
.pill { font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); border:1px solid var(--line); border-radius:20px; padding:2px 8px; }
.icon-btn { width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; padding:0; border-radius:50%; border:none; background:none; color:var(--cream); cursor:pointer; transition:background .15s; }
.icon-btn:hover { background:var(--surface); }
.icon-btn svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.theme-btn .i-moon { display:none; }
:root[data-theme="light"] .theme-btn .i-sun { display:none; }
:root[data-theme="light"] .theme-btn .i-moon { display:block; }
.acct-wrap { position:relative; }
.acct-btn { background:var(--surface); }
.acct-btn:hover, .acct-btn[aria-expanded="true"] { background:var(--surface-2); }
.acct-menu { position:absolute; top:calc(100% + 8px); right:0; z-index:150; width:248px; padding:6px 0; background:var(--raised); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 28px -10px rgba(0,0,0,0.6); }
.acct-menu[hidden] { display:none; }
.acct-who { padding:10px 16px 12px; border-bottom:1px solid var(--line); }
.acct-who-label { font-size:0.68rem; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; margin-bottom:3px; }
.acct-email { font-size:0.88rem; overflow-wrap:anywhere; }
.acct-item { display:flex; align-items:center; gap:12px; width:100%; padding:12px 16px; background:none; border:none; color:var(--cream); font-size:0.9rem; text-align:left; text-decoration:none; cursor:pointer; }
.acct-item:hover { background:var(--hover); }
.acct-item svg { width:18px; height:18px; fill:none; stroke:var(--cream-dim); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

.dash-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:0 0 16px; }
.dash-title { font-size:1.5rem; font-weight:500; }
.dash-sub { font-size:0.82rem; color:var(--muted); margin-top:3px; }
.sample-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; margin-bottom:16px; border-radius:8px; background:var(--surface); font-size:0.84rem; color:var(--cream-dim); }
.sample-bar b { color:var(--cream); font-weight:500; }
.sample-bar .btn { margin-left:auto; padding:7px 14px; }

/* Edit bar: shown while customizing. */
.edit-bar { position:sticky; top:8px; z-index:60; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 10px 10px 16px; margin-bottom:16px; border-radius:999px; background:var(--raised); border:1px solid var(--line); box-shadow:var(--shadow); }
.edit-bar-label { font-size:0.88rem; font-weight:500; margin-right:auto; }
@media (max-width:560px) { .edit-bar { border-radius:20px; } .edit-bar-label { flex-basis:100%; } .edit-bar .btn { flex:1; } }

/* ── Grid of widgets ── */
.grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
.w { grid-column:span 1; min-width:0; background:var(--bg); border-radius:8px; box-shadow:var(--shadow); padding:16px; }
.w.full { grid-column:1 / -1; }
@media (max-width:720px) { .grid { grid-template-columns:minmax(0,1fr); } .w, .w.full { grid-column:1 / -1; } }
.editing .w { outline:1.5px dashed var(--line); outline-offset:-1px; }
@media (pointer:fine) { .editing .w { cursor:grab; } }
/* Dragging: the widget lifts and follows the pointer; a dashed slot shows where it lands. */
.w.dragging { box-shadow:0 28px 56px -16px rgba(0,0,0,0.75); transform:scale(1.015); cursor:grabbing; outline-color:var(--accent); }
.w.ph { background:transparent; box-shadow:none; outline:2px dashed var(--accent); outline-offset:-2px; opacity:.5; }
body.drag-on { user-select:none; -webkit-user-select:none; cursor:grabbing; }
/* Two columns inside an expanded widget; one on phones. */
.cols { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0 28px; }
.cols > .cb { border-top:1px solid var(--line); }
.cols > .cb:nth-child(-n+2) { border-top:none; }
@media (max-width:720px) { .cols { grid-template-columns:minmax(0,1fr); } .cols > .cb:nth-child(2) { border-top:1px solid var(--line); } .cols > .col2 { margin-top:18px; } }
.sub { display:flex; justify-content:space-between; gap:10px; padding:4px 0 4px 17px; font-size:0.8rem; color:var(--cream-dim); }
.sub span:first-child { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.w-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:12px; min-height:30px; }
.w-title { font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.w-link { flex:0 0 auto; display:inline-flex; align-items:center; gap:2px; font-size:0.78rem; color:var(--cream-dim); text-decoration:none; }
.w-link:hover { color:var(--accent-light); }
.w-link svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.w-empty { color:var(--muted); font-size:0.86rem; line-height:1.6; padding:14px 0 6px; }
.w-empty a { color:var(--accent); text-decoration:none; font-weight:500; }
.w-empty .btn { margin-top:10px; }

/* Widget tools (customize mode) */
.w-tools { display:flex; align-items:center; gap:6px; margin:-4px 0 12px; }
.t-btn { width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border:none; border-radius:50%; background:var(--surface); color:var(--cream-dim); cursor:pointer; }
.t-btn:hover:not(:disabled) { background:var(--surface-2); color:var(--cream); }
.t-btn:disabled { opacity:.3; cursor:default; }
.t-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.t-btn.danger { color:var(--red); margin-left:auto; }
.t-pill { height:32px; padding:0 12px; border:none; border-radius:999px; background:var(--surface); color:var(--cream-dim); font-size:0.78rem; font-weight:500; cursor:pointer; white-space:nowrap; }
.t-pill:hover { background:var(--surface-2); color:var(--cream); }
.t-btn.grip { cursor:grab; touch-action:none; }
.t-btn.grip svg { fill:currentColor; stroke:none; }
.t-hint { font-size:0.74rem; color:var(--muted); margin:-6px 0 12px; }

/* Figures */
.big { font-size:2.1rem; font-weight:500; letter-spacing:-0.015em; line-height:1.15; }
.big.neg { color:var(--red); }
.delta { font-size:0.82rem; margin-top:4px; color:var(--cream-dim); }
.up { color:var(--green); } .down { color:var(--red); }
.eq { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
.eq-k { font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
.eq-v { font-size:1.05rem; font-weight:500; margin-top:2px; }
.stats { display:grid; grid-template-columns:1fr 1fr; }
.stat { padding:10px 0; }
.stat:nth-child(even) { padding-left:14px; border-left:1px solid var(--line); }
.stat:nth-child(n+3) { border-top:1px solid var(--line); }
.stat-k { font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
.stat-v { font-size:1.35rem; font-weight:500; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-n { font-size:0.72rem; color:var(--muted); margin-top:2px; }
.row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:0.9rem; }
.row:first-child { border-top:none; }
.row .k { color:var(--cream-dim); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .v { flex:0 0 auto; font-weight:500; }
.row.sec { padding-top:14px; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
.row.sec .v { font-size:0.9rem; letter-spacing:0; text-transform:none; color:var(--cream); }
.row.total { border-top:1px solid var(--cream-dim); font-weight:600; }
.row.total .k { color:var(--cream); }

/* Line chart */
.lc { position:relative; margin-top:6px; }
.lc svg { display:block; width:100%; height:170px; }
.lc-line { fill:none; stroke:var(--accent); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
.lc-area { fill:color-mix(in srgb, var(--accent) 14%, transparent); stroke:none; }
.lc-zero { stroke:var(--line); stroke-width:1; stroke-dasharray:4 4; }
.lc-x { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--muted); margin-top:6px; }
.lc-meta { display:flex; gap:18px; flex-wrap:wrap; font-size:0.8rem; color:var(--cream-dim); margin-top:10px; }
.lc-meta b { color:var(--cream); font-weight:500; }
.spark svg { height:70px; }

/* Bars */
.cb { padding:8px 0; }
.cb + .cb { border-top:1px solid var(--line); }
.cb-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:0.9rem; }
.cb-name { display:flex; align-items:center; gap:8px; min-width:0; }
.cb-name span:last-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cb-v { flex:0 0 auto; font-weight:500; }
.cb-v small { color:var(--muted); font-weight:400; font-size:0.78rem; }
.dot { flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--h, var(--muted)); }
.track { height:6px; border-radius:999px; background:var(--surface); margin-top:7px; overflow:hidden; }
.fill { display:block; height:100%; border-radius:999px; background:var(--h, var(--accent)); }
.fill.ok { background:var(--green); } .fill.ahead { background:var(--amber); } .fill.over { background:var(--red); }
.tb { display:flex; align-items:stretch; gap:8px; height:170px; margin-top:4px; }
.tb-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
.tb-bars { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; gap:4px; }
.tb-bar { width:34%; max-width:20px; min-height:2px; border-radius:4px 4px 2px 2px; }
.tb-bar.in { background:var(--green); } .tb-bar.out { background:var(--accent); }
.tb-lbl { font-size:0.72rem; color:var(--muted); }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:0.78rem; color:var(--cream-dim); margin-top:12px; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:9px; height:9px; border-radius:50%; display:inline-block; }

/* Lists */
.li { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
.li:first-child { border-top:none; }
.li-main { flex:1; min-width:0; }
.li-name { font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-meta { font-size:0.74rem; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-amt { flex:0 0 auto; font-size:0.9rem; font-weight:500; }
.li-amt.in { color:var(--green); }

/* Welcome (no data yet) and "also try" cards */
.welcome { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
@media (max-width:720px) { .welcome { grid-template-columns:minmax(0,1fr); } }
.start { display:flex; flex-direction:column; gap:8px; padding:20px; border-radius:8px; background:var(--bg); box-shadow:var(--shadow); text-decoration:none; }
.start h3 { font-size:1.1rem; font-weight:500; }
.start p { font-size:0.86rem; color:var(--cream-dim); line-height:1.5; flex:1; }
.start .btn { align-self:flex-start; margin-top:6px; }
.also { margin-top:16px; }

/* ── Floating card (pickers, add widget, layouts) ── */
.sheet-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:16px; }
.sheet-overlay.open { display:flex; }
.sheet { width:100%; max-width:400px; max-height:86vh; overflow-y:auto; background:var(--raised); border:1px solid var(--line); border-radius:24px; padding:20px 18px; box-shadow:0 24px 48px -16px rgba(0,0,0,0.7); }
/* Keep the scroll bar on the straight part of the edge, clear of the rounded corners. */
.sheet::-webkit-scrollbar-track { margin:22px 0; }
.sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.sheet-title { font-size:1rem; font-weight:500; }
.close-x { background:none; border:none; color:var(--muted); font-size:1.5rem; line-height:1; cursor:pointer; padding:0 4px; }
.close-x:hover { color:var(--cream); }
.sheet-sec { font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin:16px 0 4px; }
.sheet-sec:first-child { margin-top:4px; }
.opt { display:flex; align-items:center; gap:12px; width:100%; min-height:54px; padding:10px 4px; background:none; border:none; border-bottom:1px solid var(--line); color:var(--cream); font:inherit; text-align:left; cursor:pointer; }
.opt:hover:not(:disabled) { background:var(--hover); }
.opt:disabled { cursor:default; opacity:.5; }
.opt-main { flex:1; min-width:0; }
.opt-name { display:block; font-size:0.95rem; }
.opt-desc { display:block; font-size:0.76rem; color:var(--muted); margin-top:2px; line-height:1.4; }
.opt.on .opt-name { color:var(--accent-light); }
.opt-tag { flex:0 0 auto; font-size:0.72rem; color:var(--muted); }
.opt svg { flex:0 0 auto; width:18px; height:18px; fill:none; stroke:var(--accent); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

/* Confirm */
.confirm-overlay { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:24px; }
.confirm-overlay.open { display:flex; }
.confirm { width:100%; max-width:340px; padding:24px 20px 18px; background:var(--raised); border:1px solid var(--line); border-radius:24px; text-align:center; }
.cf-title { font-size:1.08rem; font-weight:500; margin-bottom:8px; }
.cf-body { font-size:0.88rem; color:var(--cream-dim); line-height:1.5; }
.cf-actions { display:flex; gap:8px; margin-top:20px; }
.cf-actions .btn { flex:1; height:46px; }

.toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--surface-2); color:var(--cream); font-size:0.84rem; padding:10px 18px; border-radius:999px; z-index:400; width:max-content; max-width:calc(100vw - 32px); text-align:center; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show { opacity:1; }
</style>
</head>
<body>

<!-- ══ SIGN IN ══ -->
<div id="authScreen" class="hidden">
  <div class="auth-panel">
    <a class="brand" href="/">VestlyFi</a>
    <h1 class="auth-title">Dashboard</h1>
    <p class="auth-sub">Your net worth and budget in one place. Same login as the net worth tracker.</p>
    <div class="field"><label for="siEmail">Email</label><input id="siEmail" type="email" autocomplete="email"></div>
    <div class="field"><label for="siPassword">Password</label><input id="siPassword" type="password" autocomplete="current-password"></div>
    <button class="btn btn-gold btn-block" onclick="signIn()">Sign in</button>
    <div class="msg" id="siMsg"></div>
    <p class="auth-alt">No account yet? <a href="/net-worth/">Create one on the net worth tracker</a>. Or <button class="link-btn" onclick="startSample()">see it with sample data</button>.</p>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="appScreen" class="hidden">
  <div class="app" id="app">
    <div class="topbar">
      <div class="topbar-left"><a class="brand" href="/">VestlyFi</a><span class="pill">Beta</span></div>
      <div class="topbar-right">

function sortedEntries(){ return D.entries.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))); }

const groupById = id => D.groups.find(g => g.id === id);

  let income = 0, spent = 0, toSaving = 0;
  for (const t of list) {
    const c = catById(t.category_id), k = kindOfCat(c), amt = Number(t.amount);
    if (k === 'transfer') { if (c.counts_as_saving) toSaving -= amt; continue; }
    if (k === 'income') income += amt;
    else if (k === 'expense') spent -= amt;

const HUES = { housing:'#7aa7ff', food:'#f0a35e', transportation:'#4cc3b5', personal:'#d08cf0', transfers:'#e8c15a', income:'#5cc28e' };
const SPARE_HUES = ['#ff8f8f', '#8fd16a', '#6fc8ff', '#f78fc0', '#b3a1ff', '#e8c15a'];

  if (!g) return '#8d8d8d';
  const k = HUES[norm(g.name)]; if (k) return k;
  let h = 0; for (const ch of String(g.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return SPARE_HUES[h % SPARE_HUES.length];
}

/* Line chart: vector-effect keeps the stroke even while the SVG stretches. */
/* vals: one series of numbers, or a list of { vals, color } sharing one scale.
   The first series gets the soft fill. */
function lineChart(vals, cls){
  const series = typeof vals[0] === 'number' ? [{ vals }] : vals;
  const W = 600, H = 170, P = 8, all = series.flatMap(s => s.vals), len = series[0].vals.length;
  let min = Math.min(...all), max = Math.max(...all);

  const x = i => len === 1 ? W / 2 : P + i * (W - 2 * P) / (len - 1);
  const y = v => P + (H - 2 * P) * (1 - (v - min) / (max - min));
  const pts = s => s.vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));

  const zero = min < 0 && max > 0 ? `<line class="lc-zero" x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" vector-effect="non-scaling-stroke"/>` : '';
  const lines = series.map(s => `<polyline class="lc-line" points="${pts(s).join(' ')}" vector-effect="non-scaling-stroke"${s.color ? ` style="stroke:${s.color}"` : ''}/>`).join('');
  return `<div class="lc ${cls || ''}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="lc-area" d="${area}"/>${zero}${lines}</svg></div>`;

function lastMonths(n){ const now = new Date(), out = []; for (let i = n - 1; i >= 0; i--) out.push(new Date(now.getFullYear(), now.getMonth() - i, 1)); return out; }

const RENDER_TITLE = {
  'nw-watch': it => it.opts ? it.opts.category : null,

      const moves = [...new Set([...Object.keys(then), ...Object.keys(nowH)])].map(k => {
        const a = then[k], b = nowH[k], h = b || a, d = (b ? b.value : 0) - (a ? a.value : 0);
        return { name:h.category, type:h.type, d, good:h.type === 'asset' ? d >= 0 : d <= 0 };
      }).filter(m => Math.abs(m.d) >= 1).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 5);
      const ca = last.assets - first.assets, cl = last.liabilities - first.liabilities;
      return `<div class="cols"><div>${lineChart(s.map(x => x.net))}${axis}
          <div class="lc-meta"><span>Change <b class="${ch >= 0 ? 'up' : 'down'}">${signed(ch)}</b></span><span>Assets <b class="${ca >= 0 ? 'up' : 'down'}">${signed(ca)}</b></span><span>Liabilities <b class="${cl <= 0 ? 'up' : 'down'}">${signed(cl)}</b></span></div></div>
        <div class="col2"><div class="row sec" style="padding-top:0"><span class="k">What moved it</span><span class="v"></span></div>${moves.map(m => `<div class="row"><span class="k">${escHtml(m.name)} <small style="color:var(--muted)">${m.type === 'asset' ? 'asset' : 'liability'}</small></span><span class="v ${m.good ? 'up' : 'down'}">${signed(m.d)}</span></div>`).join('') || '<div class="w-empty">No changes yet.</div>'}</div></div>`;
    }
    const hi = Math.max(...s.map(x => x.net)), lo = Math.min(...s.map(x => x.net));
    return lineChart(s.map(x => x.net)) + axis +
      `<div class="lc-meta"><span>Change <b class="${ch >= 0 ? 'up' : 'down'}">${signed(ch)}</b></span><span>High <b>${money(hi)}</b></span><span>Low <b>${money(lo)}</b></span></div>`;
  },
  'nw-sheet'(it){
    const h = holdings().filter(x => x.value !== 0), wide = it.size === 'full', show = wide ? 8 : 4;
    const block = (type, label) => {
      const rows = h.filter(x => x.type === type).sort((a, b) => b.value - a.value);
      const total = rows.reduce((a, x) => a + x.value, 0);
      const top = rows.slice(0, show), rest = rows.slice(show);
      let html = `<div class="row sec"><span class="k">${label}</span><span class="v">${money(total)}</span></div>`;
      html += top.map(x => `<div class="row"><span class="k">${escHtml(x.category)}</span><span class="v">${money(x.value)}</span></div>`).join('');
      if (rest.length) html += `<div class="row"><span class="k">${rest.length} more</span><span class="v">${money(rest.reduce((a, x) => a + x.value, 0))}</span></div>`;
      return { html, total };
    };
    const a = block('asset', 'Assets'), l = block('liability', 'Liabilities');
    const total = `<div class="row total"><span class="k">Net worth${wide ? ` <small style="color:var(--muted);font-weight:400">= ${money(a.total)} − ${money(l.total)}</small>` : ''}</span><span class="v">${money(a.total - l.total)}</span></div>`;
    return wide ? `<div class="cols"><div>${a.html}</div><div>${l.html}</div></div>${total}` : `<div>${a.html}${l.html}${total}</div>`;
  },
  'nw-watch'(it){
    if (!it.opts) return `<div class="w-empty">Pick an asset or liability to follow.<br><button class="btn btn-ghost" onclick="configure('${it.id}')">Pick one</button></div>`;
    const es = sortedEntries().filter(e => e.type === it.opts.type && norm(e.category) === norm(it.opts.category));
    if (!es.length) return '<div class="w-empty">No entries for this one anymore.</div>';
    const byMonth = {}; for (const e of es) byMonth[String(e.date).slice(0, 7)] = Number(e.value) || 0;
    const keys = Object.keys(byMonth).sort().slice(-12), vals = keys.map(k => byMonth[k]);
    const cur = vals[vals.length - 1], ch = cur - vals[0];
    const good = it.opts.type === 'asset' ? ch >= 0 : ch <= 0;
    return `<div class="big">${money(cur)}</div><div class="delta">${it.opts.type === 'asset' ? 'Asset' : 'Liability'}${keys.length > 1 ? ` · <span class="${good ? 'up' : 'down'}">${signed(ch)}</span> since ${monthLabel(keys[0])}` : ''}</div>` +
      (vals.length > 1 ? lineChart(vals, 'spark') : '');
  },
  'bd-month'(){
    const now = new Date(), t = totals(txIn(now));
    const rate = t.income > 0 && t.toSaving > 0.5 ? Math.round(t.toSaving / t.income * 100) + '% of income' : '';
    return `<div class="stats">
      <div class="stat"><div class="stat-k">Income</div><div class="stat-v">${money(t.income)}</div></div>
      <div class="stat"><div class="stat-k">Spent</div><div class="stat-v">${money(t.spent)}</div></div>
      <div class="stat"><div class="stat-k">Saved & invested</div><div class="stat-v">${money(t.toSaving)}</div><div class="stat-n">${rate}</div></div>
      <div class="stat"><div class="stat-k">Money out</div><div class="stat-v">${money(t.spent + t.toSaving)}</div></div>
    </div>`;
  },
  'bd-categories'(it){
    const { byGroup, byCat } = spendBy(new Date()), wide = it.size === 'full';
    const rows = D.groups.filter(g => g.kind === 'expense').map(g => ({ g, s:byGroup[g.id] || 0, t:groupTarget(g) })).filter(r => r.s > 0 || r.t > 0).sort((a, b) => b.s - a.s);
    if (!rows.length) return '<div class="w-empty">Nothing spent yet this month.</div>';
    const max = Math.max(...rows.map(r => Math.max(r.s, r.t)));
    const html = rows.slice(0, wide ? 12 : 7).map(r => {
      const st = targetState(r.s, r.t), pct = Math.max(0, Math.min(100, (r.t ? r.s / r.t : r.s / max) * 100));
      // Expanded: the subcategories that make up each category's total.
      const subs = wide ? D.cats.filter(c => c.group_id === r.g.id && (byCat[c.id] || 0) > 0).sort((a, b) => byCat[b.id] - byCat[a.id])
        .map(c => `<div class="sub"><span>${escHtml(c.name)}</span><span>${money(byCat[c.id])}${c.monthly_target != null ? ` of ${money(c.monthly_target)}` : ''}</span></div>`).join('') : '';
      return `<div class="cb" style="--h:${groupHue(r.g)}"><div class="cb-top"><span class="cb-name"><span class="dot"></span><span>${escHtml(r.g.name)}</span></span><span class="cb-v">${money(r.s)}${r.t ? `<small> of ${money(r.t)}</small>` : ''}</span></div><div class="track"><span class="fill ${st}" style="width:${pct.toFixed(1)}%"></span></div>${subs ? `<div style="margin-top:6px">${subs}</div>` : ''}</div>`;
    });
    return wide ? `<div class="cols">${html.join('')}</div>` : html.join('');
  },
  'bd-trend'(it){
    const months = lastMonths(it.size === 'full' ? 12 : 6), t = months.map(m => totals(txIn(m)));
    const max = Math.max(1, ...t.map(x => Math.max(x.income, x.spent)));
    const avg = t.reduce((a, x) => a + x.spent, 0) / t.length;
    return `<div class="tb">${months.map((m, i) => `<div class="tb-col"><div class="tb-bars"><span class="tb-bar in" style="height:${(t[i].income / max * 100).toFixed(1)}%" title="Income ${money(t[i].income)}"></span><span class="tb-bar out" style="height:${(Math.max(0, t[i].spent) / max * 100).toFixed(1)}%" title="Spent ${money(t[i].spent)}"></span></div><span class="tb-lbl">${monthName(m)}</span></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--green)"></i>Income</span><span><i style="background:var(--accent)"></i>Spent</span><span>Average spent <b>${money(avg)}</b></span></div>`;
  },
  'bd-targets'(it){
    const { byCat } = spendBy(new Date()), wide = it.size === 'full';
    const rows = D.cats.filter(c => !c.hidden && c.monthly_target != null && Number(c.monthly_target) > 0 && kindOfCat(c) === 'expense').map(c => ({ c, s:byCat[c.id] || 0, t:Number(c.monthly_target) })).sort((a, b) => (b.s / b.t) - (a.s / a.t));
    if (!rows.length) return `<div class="w-empty">No targets set. <a href="/budget/">Set them in the budget tracker</a></div>`;
    const html = (wide ? rows : rows.slice(0, 6)).map(r => `<div class="cb"><div class="cb-top"><span class="cb-name"><span>${escHtml(r.c.name)}</span></span><span class="cb-v">${money(r.s)}<small> of ${money(r.t)}</small></span></div><div class="track"><span class="fill ${targetState(r.s, r.t)}" style="width:${Math.min(100, r.s / r.t * 100).toFixed(1)}%"></span></div></div>`).join('');
    return wide ? `<div class="cols">${html}</div>` : html;
  },
  'bd-watch'(it){
    if (!it.opts) return `<div class="w-empty">Pick a category or subcategory to follow.<br><button class="btn btn-ghost" onclick="configure('${it.id}')">Pick one</button></div>`;
    const isGroup = it.opts.kind === 'group', x = isGroup ? groupById(it.opts.id) : catById(it.opts.id);
    if (!x) return '<div class="w-empty">This category no longer exists.</div>';
    const g = isGroup ? x : groupById(x.group_id);
    const months = lastMonths(6), vals = months.map(m => { const s = spendBy(m); return isGroup ? (s.byGroup[x.id] || 0) : (s.byCat[x.id] || 0); });
    const cur = vals[vals.length - 1], t = isGroup ? groupTarget(x) : (x.monthly_target != null ? Number(x.monthly_target) : 0);
    const avg = vals.slice(0, -1).reduce((a, v) => a + v, 0) / Math.max(1, vals.length - 1);
    const max = Math.max(1, t, ...vals);
    return `<div class="big">${money(cur)}</div><div class="delta">${t ? `of ${money(t)} this month` : 'this month'} · ${money(avg)} a month before</div>
      <div class="tb" style="height:110px;margin-top:14px">${months.map((m, i) => `<div class="tb-col"><div class="tb-bars"><span class="tb-bar" style="width:46%;max-width:26px;height:${(vals[i] / max * 100).toFixed(1)}%;background:${i === months.length - 1 ? 'var(--accent)' : groupHue(g)}" title="${money(vals[i])}"></span></div><span class="tb-lbl">${monthName(m)}</span></div>`).join('')}</div>`;
  },
  'bd-recent'(){
    const list = D.tx.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.created_at || '').localeCompare(String(a.created_at || ''))).slice(0, 6);
    if (!list.length) return '<div class="w-empty">No transactions yet.</div>';
    return list.map(t => {
      const c = catById(t.category_id), a = acctById(t.account_id), amt = Number(t.amount);
      const name = t.description || (c ? c.name : 'Uncategorized');
      const meta = [t.description && c && norm(t.description) !== norm(c.name) ? c.name : null, a ? a.name : null, shortDate(t.date)].filter(Boolean).join(' · ');
      return `<div class="li" style="--h:${groupHue(c && groupById(c.group_id))}"><span class="dot"></span><div class="li-main"><div class="li-name">${escHtml(name)}</div><div class="li-meta">${escHtml(meta)}</div></div><div class="li-amt${amt > 0 ? ' in' : ''}">${amt > 0 ? '+' : ''}${moneyC(Math.abs(amt))}</div></div>`;
    }).join('');
  },
  'bd-upcoming'(){
    const list = D.rec.slice().sort((a, b) => String(a.next_date).localeCompare(String(b.next_date))).slice(0, 5);
    if (!list.length) return `<div class="w-empty">Nothing recurring. <a href="/budget/">Add one in the budget tracker</a></div>`;
    return list.map(r => {
      const c = catById(r.category_id), amt = Number(r.amount);
      return `<div class="li" style="--h:${groupHue(c && groupById(c.group_id))}"><span class="dot"></span><div class="li-main"><div class="li-name">${escHtml(r.description || (c ? c.name : 'Recurring'))}</div><div class="li-meta">${shortDate(r.next_date)}</div></div><div class="li-amt${amt > 0 ? ' in' : ''}">${r.amount_varies ? '~' : ''}${amt > 0 ? '+' : ''}${moneyC(Math.abs(amt))}</div></div>`;
    }).join('');
  },
  'debts'(){
    // The debt tracker when it has debts, else the liabilities on the net worth tracker.
    let rows = D.debts.filter(d => !d.paid_off).map(d => ({ name:d.name, cur:Number(d.balance) || 0, orig:Number(d.original_balance) || Number(d.balance) || 0 }));
    if (!rows.length) {
      const first = {};
      for (const e of sortedEntries()) if (e.type === 'liability' && !(e.category in first)) first[e.category] = Number(e.value) || 0;
      rows = holdings().filter(h => h.type === 'liability' && h.value > 0).map(h => ({ name:h.category, cur:h.value, orig:Math.max(h.value, first[h.category] || 0) }));
    }
    rows.sort((a, b) => b.cur - a.cur);
    const cur = rows.reduce((a, r) => a + r.cur, 0), orig = rows.reduce((a, r) => a + r.orig, 0);
    const paid = orig > 0 ? Math.max(0, (orig - cur) / orig * 100) : 0;
    return `<div class="big">${money(cur)}</div><div class="delta">left to pay · <span class="up">${paid.toFixed(0)}% paid off</span></div>
      <div style="margin-top:12px">${rows.slice(0, 5).map(r => { const p = r.orig > 0 ? Math.max(0, Math.min(100, (r.orig - r.cur) / r.orig * 100)) : 0; return `<div class="cb"><div class="cb-top"><span class="cb-name"><span>${escHtml(r.name)}</span></span><span class="cb-v">${money(r.cur)}<small> · ${p.toFixed(0)}% paid</small></span></div><div class="track"><span class="fill ok" style="width:${p.toFixed(1)}%"></span></div></div>`; }).join('')}</div>`;
  },
};

/* ── Customizing ── */
function setEditing(on){
  editing = on;
  if (on) ensureLayout();
  closeSheet(); render();
  if (on) toast('Drag widgets to move them.');
}
function findItem(id){ return layout.items.find(x => x.id === id); }
/* Keyboard moving, from the drag handle: arrow keys step one place. */
function moveItem(id, dir){
  const a = layout.items, i = a.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; saveLayout(); render();
  const el = document.getElementById('w_' + id); if (el) el.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
function gripKey(e, id){
  const dir = { ArrowUp:-1, ArrowLeft:-1, ArrowDown:1, ArrowRight:1 }[e.key];
  if (!dir) return;
  e.preventDefault(); moveItem(id, dir);
  const g = document.querySelector('#w_' + id + ' .grip'); if (g) g.focus();
}
function toggleSize(id){ const it = findItem(id); it.size = it.size === 'full' ? 'half' : 'full'; saveLayout(); render(); }

/* ── Drag to rearrange ──
   Mouse: grab anywhere on a widget (not its buttons). Touch: grab the handle,
   so the rest of the widget still scrolls the page. The widget follows the
   pointer and a dashed slot shows where it will land. */
let drag = null, armed = null;
function armDrag(e, id, fromHandle){
  if (!editing || drag || (e.button !== undefined && e.button !== 0)) return;
  if (!fromHandle && (e.pointerType !== 'mouse' || e.target.closest('button, a'))) return;
  if (fromHandle) { e.stopPropagation(); e.preventDefault(); startDrag(id, e.clientX, e.clientY); return; }
  // From the body: wait for a few pixels of movement so a plain click stays a click.
  armed = { id, x:e.clientX, y:e.clientY };
  document.addEventListener('pointermove', armedMove);
  document.addEventListener('pointerup', disarm, { once:true });
}
function armedMove(e){
  if (!armed) return;
  if (Math.hypot(e.clientX - armed.x, e.clientY - armed.y) < 5) return;
  const { id, x, y } = armed; disarm();
  startDrag(id, x, y); onDragMove(e);
}
function disarm(){ armed = null; document.removeEventListener('pointermove', armedMove); }
function startDrag(id, px, py){
  const el = document.getElementById('w_' + id); if (!el) return;
  const r = el.getBoundingClientRect();
  const ph = document.createElement('div');
  ph.className = 'w ph' + (el.classList.contains('full') ? ' full' : '');
  ph.style.height = r.height + 'px';
  el.after(ph);
  Object.assign(el.style, { position:'fixed', left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px', zIndex:100, pointerEvents:'none', margin:0 });
  el.classList.add('dragging'); document.body.classList.add('drag-on');
  drag = { id, el, ph, dx:px - r.left, dy:py - r.top, x:px, y:py, raf:0 };
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  drag.raf = requestAnimationFrame(autoScroll);
}
function onDragMove(e){
  if (!drag) return;
  e.preventDefault();
  drag.x = e.clientX; drag.y = e.clientY;
  drag.el.style.left = (e.clientX - drag.dx) + 'px';
  drag.el.style.top = (e.clientY - drag.dy) + 'px';
  placeSlot();
}
function placeSlot(){
  const grid = document.getElementById('grid');
  const sib = (n, dir) => { let s = dir < 0 ? n.previousElementSibling : n.nextElementSibling; while (s === drag.el) s = dir < 0 ? s.previousElementSibling : s.nextElementSibling; return s; };
  const hit = document.elementFromPoint(drag.x, drag.y);
  const target = hit && hit.closest('#grid > .w');
  if (!target) {
    // Below the last widget: drop at the end.
    const last = [...grid.children].filter(n => n !== drag.el).pop();
    if (last && last !== drag.ph && drag.y > last.getBoundingClientRect().bottom) grid.appendChild(drag.ph);
    return;
  }
  if (target === drag.ph) return;
  const r = target.getBoundingClientRect();
  const sideBySide = r.width < grid.clientWidth * 0.75;   // half-width neighbours compare left/right
  const before = sideBySide ? drag.x < r.left + r.width / 2 : drag.y < r.top + r.height / 2;
  if (before ? sib(target, -1) === drag.ph : sib(target, 1) === drag.ph) return;
  grid.insertBefore(drag.ph, before ? target : target.nextElementSibling);
}
function autoScroll(){
  if (!drag) return;
  const edge = 80, y = drag.y;
  const dy = y < edge ? -Math.ceil((edge - y) / 6) : y > innerHeight - edge ? Math.ceil((y - innerHeight + edge) / 6) : 0;
  if (dy) { window.scrollBy(0, dy); placeSlot(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function endDrag(){
  if (!drag) return;
  cancelAnimationFrame(drag.raf);
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  const { el, ph } = drag;
  ph.replaceWith(el);
  el.removeAttribute('style'); el.classList.remove('dragging'); document.body.classList.remove('drag-on');
  const order = [...document.querySelectorAll('#grid > .w[data-id]')].map(n => n.dataset.id);
  layout.items.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  drag = null; saveLayout(); render();
}
async function removeItem(id){
  const it = findItem(id), def = WIDGETS[it.type];
  if (!await askConfirm({ title:`Remove ${(RENDER_TITLE[it.type] && RENDER_TITLE[it.type](it)) || def.name}?`, body:'You can add it back anytime.', yes:'Remove', no:'Cancel' })) return;
  layout.items = layout.items.filter(x => x.id !== id); saveLayout(); render();
}
function openAddSheet(){
  const onDash = new Set(layout.items.map(x => x.type));
  let html = '';
  for (const [src, label] of SOURCES) {
    html += `<div class="sheet-sec">${label}</div>`;
    for (const [type, def] of Object.entries(WIDGETS)) {
      if (def.src !== src) continue;
      const added = onDash.has(type) && !def.multi;
      html += `<button class="opt" onclick="addWidget('${type}')" ${added ? 'disabled' : ''}><span class="opt-main"><span class="opt-name">${escHtml(def.name)}</span><span class="opt-desc">${escHtml(def.desc)}</span></span>${added ? '<span class="opt-tag">Added</span>' : PLUS}</button>`;
    }
  }
  showSheet('Add a widget', html);
}
function addWidget(type){
  const def = WIDGETS[type], it = { id:uid(), type, size:def.size, opts:null };
  layout.items.push(it); saveLayout(); closeSheet(); render();
  const el = document.getElementById('w_' + it.id); if (el) el.scrollIntoView({ block:'center', behavior:'smooth' });
  if (def.config) configure(it.id);
}
function configure(id){
  ensureLayout();
  const it = findItem(id); if (!it) return;
  let opts = [];
  if (it.type === 'nw-watch') {
    const h = holdings().filter(x => x.value !== 0).sort((a, b) => (a.type === b.type ? b.value - a.value : a.type === 'asset' ? -1 : 1));
    opts = h.map(x => ({ key:x.type + '|' + x.category, name:x.category, desc:(x.type === 'asset' ? 'Asset · ' : 'Liability · ') + money(x.value), val:{ type:x.type, category:x.category } }));
  } else if (it.type === 'bd-watch') {
    for (const g of D.groups.filter(g => g.kind === 'expense' && !g.hidden).sort((a, b) => a.sort_order - b.sort_order)) {
      opts.push({ key:'group|' + g.id, name:g.name, desc:'Whole category', val:{ kind:'group', id:g.id } });
      for (const c of D.cats.filter(c => c.group_id === g.id && !c.hidden).sort((a, b) => a.sort_order - b.sort_order))
        opts.push({ key:'cat|' + c.id, name:c.name, desc:'In ' + g.name, val:{ kind:'cat', id:c.id }, sub:true });
    }
  }
  const curKey = it.opts ? (it.type === 'nw-watch' ? it.opts.type + '|' + it.opts.category : it.opts.kind + '|' + it.opts.id) : null;
  if (!opts.length) { showSheet('Nothing to pick yet', '<div class="w-empty">Log some data in that tracker first.</div>'); return; }
  configure.pending = { id, opts };
  showSheet(it.type === 'nw-watch' ? 'Pick an asset or liability' : 'Pick a category',
    opts.map((o, i) => `<button class="opt${o.key === curKey ? ' on' : ''}" onclick="pickConfig(${i})" ${o.sub ? 'style="padding-left:22px"' : ''}><span class="opt-main"><span class="opt-name">${escHtml(o.name)}</span><span class="opt-desc">${escHtml(o.desc)}</span></span>${o.key === curKey ? CHECK : ''}</button>`).join(''));
}
function pickConfig(i){
  const p = configure.pending, it = p && findItem(p.id); if (!it) return;
  it.opts = p.opts[i].val; saveLayout(); closeSheet(); render();
}
function openLayouts(){
  showSheet('Start from a layout', '<div class="w-empty" style="padding-top:0">Replaces the widgets on your dashboard.</div>' +
    Object.entries(PRESETS).map(([k, p]) => `<button class="opt" onclick="choosePreset('${k}')"><span class="opt-main"><span class="opt-name">${p.name}</span><span class="opt-desc">${p.desc} ${p.items.length} widgets.</span></span>${CHEV.replace('<svg', '<svg style="stroke:var(--muted)"')}</button>`).join(''));
}
async function choosePreset(k){
  closeSheet();
  if (!await askConfirm({ title:`Use the ${PRESETS[k].name} layout?`, body:'This replaces your current widgets.', yes:'Use it', no:'Cancel' })) return;
  layout = { preset:k, items:itemsFor(k) }; saveLayout(); render();
}

/* ── Sheet, confirm ── */
function showSheet(title, html){ document.getElementById('sheetTitle').textContent = title; document.getElementById('sheetBody').innerHTML = html; document.getElementById('sheet').classList.add('open'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }
let cfResolve = null;
function askConfirm({ title, body, yes = 'Yes', no = 'No' }){
  document.getElementById('cfTitle').textContent = title;
  document.getElementById('cfBody').textContent = body || '';
  document.getElementById('cfYes').textContent = yes;
  document.getElementById('cfNo').textContent = no;
  document.getElementById('confirmBox').classList.add('open');
  return new Promise(r => { cfResolve = r; });
}
function answerConfirm(v){ document.getElementById('confirmBox').classList.remove('open'); const r = cfResolve; cfResolve = null; if (r) r(v); }
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('confirmBox').classList.contains('open')) return answerConfirm(false);
  if (document.getElementById('sheet').classList.contains('open')) return closeSheet();
  if (!document.getElementById('acctMenu').hidden) return closeAcctMenu();
  if (editing) setEditing(false);
});

/* ── Theme, account menu ── */
function toggleTheme(){
  const light = document.documentElement.dataset.theme !== 'light';
  if (light) document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('vf-theme', light ? 'light' : 'dark'); } catch (e) {}
}
function toggleAcctMenu(){ document.getElementById('acctMenu').hidden ? openAcctMenu() : closeAcctMenu(); }
function openAcctMenu(){ document.getElementById('acctMenu').hidden = false; document.getElementById('acctBtn').setAttribute('aria-expanded', 'true'); }
function closeAcctMenu(){ document.getElementById('acctMenu').hidden = true; document.getElementById('acctBtn').setAttribute('aria-expanded', 'false'); }
document.addEventListener('click', e => { if (!e.target.closest('.acct-wrap')) closeAcctMenu(); });

/* ── Auth and loading ── */
function showAuth(){ document.getElementById('appScreen').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); }
function showApp(){ document.getElementById('authScreen').classList.add('hidden'); document.getElementById('appScreen').classList.remove('hidden'); }
async function signIn(){
  const msg = document.getElementById('siMsg');
  msg.className = 'msg'; msg.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email:document.getElementById('siEmail').value.trim(), password:document.getElementById('siPassword').value });
  if (error) { msg.className = 'msg err'; msg.textContent = error.message; }
}
['siEmail', 'siPassword'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); }));
async function signOut(){ closeAcctMenu(); if (sample) return exitSample(); await sb.auth.signOut(); }

async function loadAll(){
  const since = ymd(new Date(new Date().getFullYear(), new Date().getMonth() - 11, 1));   // 12 months, for the expanded trend
  const q = (p) => p.then(r => r.error ? (console.error(r.error), []) : (r.data || [])).catch(e => (console.error(e), []));
  const [entries, groups, cats, accts, tx, rec, debts] = await Promise.all([
    q(sb.from('net_worth_entries').select('type,category,value,date,paid_off').order('date', { ascending:true })),
    q(sb.from('budget_groups').select('*').order('sort_order')),
    q(sb.from('budget_categories').select('*').order('sort_order')),
    q(sb.from('budget_accounts').select('*').order('sort_order')),
    q(sb.from('budget_transactions').select('id,date,amount,category_id,account_id,description,pending,created_at').gte('date', since)),
    q(sb.from('budget_recurring').select('*').eq('active', true).order('next_date')),
    q(sb.from('debts').select('*').order('sort_order', { ascending:true })),
    VestlyCurrency.load(sb, user.id).catch(e => console.error(e)),
  ]);
  D = { entries, groups, cats, accts, tx, rec, debts };
}
async function boot(session){
  if (sample) return;
  if (!session || !session.user) { user = null; booted = false; showAuth(); return; }
  if (booted && user && user.id === session.user.id) return;
  user = session.user; booted = true;
  document.getElementById('userEmail').textContent = user.email || '';
  showApp();
  document.getElementById('grid').innerHTML = '<div class="w full"><div class="w-empty">Loading…</div></div>';
  await loadAll();
  loadLayout(); render();
}
sb.auth.getSession().then(({ data }) => boot(data.session));
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') { user = null; booted = false; if (!sample) showAuth(); return; }
  if (event === 'SIGNED_IN') boot(session);
});

/* ── Sample data: a made-up household, so the page can be seen without an account ── */
function startSample(){
  sample = true; D = sampleData(); loadLayout();
  document.getElementById('sampleBar').classList.remove('hidden');
  document.getElementById('userEmail').textContent = 'Sample data';
  document.getElementById('acctLabel').textContent = 'Viewing';
  document.getElementById('signOutLabel').textContent = 'Exit sample';
  showApp(); render();
}
function exitSample(){ sample = false; editing = false; location.href = location.pathname; }
function sampleData(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const now = new Date(), entries = [];
  for (let i = 13; i >= 0; i--) {
    const d = ymd(new Date(now.getFullYear(), now.getMonth() - i, 1)), k = 13 - i;
    const add = (type, category, value) => entries.push({ type, category, value:Math.round(value), date:d, paid_off:false });
    add('asset', 'Home', 405000 + k * 1500);
    add('asset', '401(k)', 61000 + k * 1450 + rnd() * 2500);
    add('asset', 'Brokerage', 17000 + k * 950 + rnd() * 1800);
    add('asset', 'Checking', 5200 + rnd() * 1600);
    add('asset', 'Car', 24000 - k * 260);
    add('liability', 'Mortgage', 319000 - k * 720);
    add('liability', 'Car loan', 21500 - k * 460);
    add('liability', 'Credit card', 900 + rnd() * 1500);
  }
  const G = (id, name, kind, o) => ({ id, name, kind, sort_order:o, hidden:false });
  const groups = [G('g1','Housing','expense',1), G('g2','Food','expense',2), G('g3','Transportation','expense',3), G('g4','Personal','expense',4), G('g5','Transfers','transfer',5), G('g6','Income','income',6)];
  const C = (id, g, name, o, t, extra) => Object.assign({ id, group_id:g, name, sort_order:o, hidden:false, monthly_target:t == null ? null : t }, extra || {});
  const cats = [C('c1','g1','Rent',1,1850), C('c2','g1','Utilities',2,160), C('c3','g2','Groceries',1,550), C('c4','g2','Restaurants',2,200), C('c5','g2','Coffee',3,40),
    C('c6','g3','Gas',1,140), C('c7','g3','Parking',2), C('c8','g4','Subscriptions',1,45), C('c9','g4','Clothing',2), C('c10','g5','To savings',1,null,{ counts_as_saving:true }), C('c11','g6','Paycheck',1)];
  const accts = [{ id:'a1', name:'Chase card' }, { id:'a2', name:'Checking' }];
  const tx = []; let n = 0;
  const T = (d, cat, amt, desc, acct) => { if (d <= now) tx.push({ id:'t' + (n++), date:ymd(d), amount:Math.round(amt * 100) / 100, category_id:cat, account_id:acct || 'a1', description:desc || '', created_at:d.toISOString() }); };
  for (let i = 11; i >= 0; i--) {
    const y = now.getFullYear(), m = now.getMonth() - i, D_ = day => new Date(y, m, day);
    T(D_(1), 'c11', 3250, 'Paycheck', 'a2'); T(D_(15), 'c11', 3250, 'Paycheck', 'a2');
    T(D_(1), 'c1', -1850, 'Rent', 'a2'); T(D_(9), 'c2', -(120 + rnd() * 60), 'Electric');
    for (const day of [3, 10, 17, 24]) T(D_(day), 'c3', -(95 + rnd() * 70), 'Trader Joe’s');
    for (const day of [6, 13, 21]) T(D_(day), 'c4', -(30 + rnd() * 45), ['Tacos', 'Pho', 'Pizza'][day % 3]);
    for (const day of [2, 8, 12, 19, 26]) T(D_(day), 'c5', -(5 + rnd() * 3), 'Coffee');
    T(D_(5), 'c6', -(45 + rnd() * 20), 'Shell'); T(D_(20), 'c6', -(45 + rnd() * 20), 'Shell');
    T(D_(11), 'c8', -15.49, 'Netflix'); T(D_(14), 'c8', -11.99, 'Spotify');
    if (i % 2 === 0) T(D_(18), 'c9', -(60 + rnd() * 90), 'Uniqlo');
    T(D_(16), 'c10', -800, 'To savings', 'a2');
  }
  const nx = (day) => { const d = new Date(now.getFullYear(), now.getMonth(), day); if (d <= now) d.setMonth(d.getMonth() + 1); return ymd(d); };
  const rec = [{ id:'r1', description:'Rent', amount:-1850, category_id:'c1', next_date:nx(1) }, { id:'r2', description:'Paycheck', amount:3250, category_id:'c11', next_date:nx(15) },
    { id:'r3', description:'Netflix', amount:-15.49, category_id:'c8', next_date:nx(11) }, { id:'r4', description:'Electric', amount:-150, category_id:'c2', next_date:nx(9), amount_varies:true }];
  // No debt-tracker rows: Debt payoff falls back to the net worth liabilities, so the numbers agree.
  return { entries, groups, cats, accts, tx, rec, debts:[] };
}
if (new URLSearchParams(location.search).has('sample')) startSample();
</script>
